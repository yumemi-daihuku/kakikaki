<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小説執筆ノート</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--bd:#ddd6c8;--mut:#777;--ac:#8a5a2b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--fg:#e8e4dc;--card:#26241f;--bd:#3d3a32;--mut:#9a958a;--ac:#d9a066}}
:root[data-theme="dark"]{--bg:#1b1a18;--fg:#e8e4dc;--card:#26241f;--bd:#3d3a32;--mut:#9a958a;--ac:#d9a066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff,"Hiragino Mincho ProN","Yu Mincho",serif)}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
#title{flex:1;min-width:140px;font:700 18px inherit;font-family:inherit;background:transparent;color:var(--fg);border:0;border-bottom:1px dashed var(--bd);padding:4px}
button,select,input[type=number]{font-family:inherit;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
main{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:12px;padding:12px 14px;max-width:1300px;margin:0 auto;align-items:start}
@media(max-width:960px){main{grid-template-columns:1fr}#sl{max-height:150px}}
#sl{max-height:72vh;overflow:auto;margin-bottom:8px}
.si{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;cursor:pointer}
.si.on{border-color:var(--ac);background:var(--bg)}
.si b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wrap{position:relative;height:62vh;min-height:320px;background:var(--card);border:1px solid var(--bd);border-radius:8px}
#hl,#ed{position:absolute;inset:0;margin:0;padding:14px;font-size:var(--fs,17px);line-height:1.9;font-family:inherit;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;overflow:auto;border:0;letter-spacing:0}
#hl{color:transparent;pointer-events:none;overflow:hidden}
#hl mark{color:transparent;border-radius:3px}
#ed{background:transparent;color:var(--fg);resize:none;outline:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:13px;color:var(--mut);font-weight:600}
.big{font-size:28px;font-variant-numeric:tabular-nums;font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#wd{font-size:22px;font-weight:700;color:var(--ac)}
#wm{font-size:14px;line-height:1.6;margin:4px 0 8px}
small,.mut{color:var(--mut);font-size:12px}
#fx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.6);z-index:50;color:#fff;font-size:18px;text-align:center;overflow:hidden}
#fx.on{display:flex;animation:fl .7s ease 3}
#fx b{font-size:44px;animation:pop .8s ease infinite alternate}
#fx b,#fx div,#fx button{position:relative}
#fx i{position:absolute;top:-20px;width:10px;height:14px;animation:fall 3s linear forwards}
@keyframes fl{50%{background:rgba(255,200,80,.6)}}
@keyframes pop{to{transform:scale(1.2)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#dlg,#hd{position:fixed;inset:0;display:none;background:rgba(0,0,0,.5);z-index:40;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));overflow:auto}
#dlg.on,#hd.on{display:block}
#dlg .in,#hd .in{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
#dlg h4{margin:12px 0 6px}
.in input[type=text],.in textarea{font-family:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px}
#wl{max-height:220px;overflow:auto;font-size:13px;border:1px solid var(--bd);border-radius:6px;padding:4px 8px}
.wi{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--bd);padding:3px 0}
#exi,#fr input{font-family:inherit;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px}
.ch{margin:8px 0 2px;font-size:13px;font-weight:600}
.sc{padding:3px 6px 3px 16px;border-radius:5px;font-size:13px;cursor:pointer;border:1px solid transparent}
.sc.on{background:var(--bg);border-color:var(--ac)}
.ab{margin-left:4px;color:var(--mut);cursor:pointer;font-size:12px;padding:0 2px;font-weight:400}.ab:hover{color:var(--ac)}
#side{padding:14px}#side h3{font-size:16px}#side button{padding:8px 12px;font-size:14px}
.si{padding:10px 12px}.si b{font-size:16px}.si small{font-size:12px}
.ch{font-size:15px;margin:12px 0 4px}.sc{font-size:15px;padding:6px 8px 6px 18px}
.ab{font-size:15px;padding:2px 5px;margin-left:6px}
@media(max-width:960px){#sl{max-height:260px}}
#tabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--bd);overflow-x:auto}
#tabs button{white-space:nowrap}#tabs button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
body.focus #tabs{display:none}
#pg-x{max-width:1100px;margin:0 auto;padding:14px}
.eg{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px}@media(max-width:760px){.eg{grid-template-columns:1fr}}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.fm label{display:block;font-size:12px;color:var(--mut);margin-top:8px}
.fm input,.fm textarea,#pgq{width:100%;font-family:inherit;font-size:14px;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px}
.li{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;cursor:pointer;background:var(--card)}.li.on{border-color:var(--ac)}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px}.bars div{flex:1;text-align:center;font-size:12px}.bars i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
#hl,#ed{font-family:var(--ff,inherit);line-height:var(--lh,1.9);letter-spacing:var(--ls,0)}
#wrap{max-width:var(--ew,none);margin-left:auto;margin-right:auto}
.fm select{width:100%;padding:6px;font-family:inherit}
.fm input[type=range]{padding:0}
.stat b+b{margin-left:12px}
:root[data-theme="sepia"]{--bg:#f1e6d0;--fg:#3b2f22;--card:#f8eed9;--bd:#d6c4a2;--mut:#8a7658;--ac:#8a5a2b}
:root[data-theme="night"]{--bg:#0f1626;--fg:#dbe4f5;--card:#18223a;--bd:#2a3a5c;--mut:#8da0c4;--ac:#7fb0ff}
:root[data-theme="paper"]{--bg:#f4f1ea;--fg:#2b2b2b;--card:#fffdf8;--bd:#e0dccf;--mut:#8b8678;--ac:#9a6b3a}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.g2 .stat span{white-space:nowrap}
@media(min-width:961px){
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header,#tabs{flex:none}
header{padding:6px 14px}#tabs{padding:4px 14px}
main{flex:1;min-height:0;width:100%;align-items:stretch;padding-top:8px;padding-bottom:8px}
#side{display:flex;flex-direction:column;min-height:0}
#side #sl{flex:1;max-height:none;min-height:0}
main>section{display:flex;flex-direction:column;min-height:0}
#wrap{flex:1;height:auto;min-height:0;width:100%}
aside{min-height:0;overflow:auto}
aside .card{padding:8px 10px;margin-bottom:8px}
aside .card h3{margin:0 0 4px;font-size:12px}
aside .big{font-size:24px}
aside .stat{font-size:13px;padding:1px 0}
aside button,aside input[type=number]{padding:3px 8px;font-size:13px}
#wd{font-size:18px}
#wm{font-size:13px;line-height:1.5;margin:2px 0;max-height:5em;overflow:auto}
#pg-x{flex:1;min-height:0;overflow:auto;width:100%}
}
body.focus aside,body.focus #side,body.focus header .opt{display:none}
body.focus main{grid-template-columns:1fr}
</style>
</head>
<body>
<header>
<input id="title" placeholder="作品タイトル" maxlength="80">
<span class="opt row">
<label class="mut">文字 <select id="fs"><option value="15">小</option><option value="17" selected>中</option><option value="20">大</option><option value="24">特大</option></select></label>
<button id="bfind">検索</button><button id="bhist">履歴</button><button id="theme">🌓</button>
</span>
<button id="focus">集中モード</button>
<button id="copy">全文コピー</button>
</header>
<nav id="tabs"><button data-p="w" class="on">✍ 執筆</button><button data-p="x">📊 統計</button><button data-p="ch">👤 登場人物</button><button data-p="wd">🌏 設定資料</button><button data-p="tm">📖 用語辞典</button><button data-p="pl">🧭 プロット</button><button data-p="an">📝 分析</button><button data-p="cf">⚙ 設定</button></nav>
<main>
<nav id="side" class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">📚 物語</h3><button id="sadd">＋ 新規</button></div><div id="sl"></div><div class="row"><button id="sdup">作品複製</button><button id="sdel">作品削除</button></div><div class="row" style="margin-top:6px"><button id="cadd">＋章</button></div><div class="row" style="margin-top:6px"><button id="bkp">バックアップ</button><button id="bkr">復元</button><input type="file" id="bkf" accept=".json,application/json" hidden></div><small>題名は上部の欄、章・シーン名は✎で編集</small></nav>
<section>
<div id="fr" class="row" style="display:none;margin-bottom:8px"><input type="text" id="fi" placeholder="検索" style="width:130px"><input type="text" id="ri" placeholder="置換後" style="width:130px"><button id="fp">前へ</button><button id="fn">次へ</button><button id="f1">置換</button><button id="fa">すべて置換</button><small id="fc"></small></div>
<div id="wrap"><div id="hl"></div><textarea id="ed" placeholder="ここに物語を書き始めましょう…" spellcheck="false"></textarea></div>
<div class="row" style="margin-top:8px"><label class="mut"><input type="checkbox" id="hlOn" checked> 重複語ハイライト(200字以内に2回以上)</label></div>
<div class="row" style="margin-top:6px"><input type="text" id="exi" placeholder="除外する語(複数は空白区切り)" style="width:210px" maxlength="60"><button id="exa">除外に追加</button></div>
<div id="exl" class="mut" style="margin-top:4px;line-height:2"></div>
<div id="legend" class="mut" style="margin-top:4px;line-height:1.8"></div>
<div class="mut" id="saved" style="margin-top:4px">未保存</div>
</section>
<aside>
<div class="card"><h3>⏱ 執筆タイマー<span id="pph"></span></h3>
<div class="big" id="tm">25:00</div>
<div class="bar" style="margin:2px 0 6px"><i id="tb" style="width:100%"></i></div>
<div class="row" style="margin:4px 0"><input type="number" id="tmin" min="1" max="180" style="width:64px"><small>分</small><button class="pz" data-m="10">10</button><button class="pz" data-m="25">25</button><button class="pz" data-m="45">45</button></div>
<div class="row" style="margin-top:4px"><button id="go">▶ 開始</button><button id="rs">リセット</button><label class="mut" title="集中と休憩を交互に切り替えます"><input type="checkbox" id="pomo"> ポモドーロ</label></div></div>
<div class="card"><h3 title="入力が30秒以上空いた間は執筆時間に含めません。一度に100字超の増加(貼り付け)は書いた量に数えません。">✍ 執筆速度(常時計測)</h3>
<div class="stat"><span>速度</span><b><span id="spm">0</span> 字/分 (<span id="sph">0</span> 字/時)</b></div>
<div class="stat"><span>書いた量 / 執筆時間</span><b><span id="add">0</span> 字 / <span id="act">00:00</span></b></div>
<div class="row" style="margin-top:4px"><button id="rsp">記録をリセット</button></div></div>
<div class="card"><h3>📊 文字数</h3><div class="g2">
<div class="stat"><span>シーン</span><b id="c1">0</b></div>
<div class="stat"><span>全体</span><b id="c5">0</b></div>
<div class="stat"><span>読了(全体)</span><b id="c6">-</b></div>
<div class="stat"><span>空白除く</span><b id="c2">0</b></div>
<div class="stat"><span>原稿用紙(枚)</span><b id="c3">0</b></div>
<div class="stat"><span>段落</span><b id="c4">0</b></div>
</div><div class="row" style="margin-top:4px"><small>目標</small><input type="number" id="goal" min="0" step="100" style="width:90px"><small>字</small></div>
<div class="bar"><i id="pb"></i></div><small id="pt"></small> <small id="dgt" class="mut"></small></div>
<div class="card">
<div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0" title="30秒ごとに自動で切り替わります">📖 今日の言葉</h3><span class="row" style="gap:4px"><button id="pv" style="padding:5px 8px">←</button><button id="nx" style="padding:5px 8px">→</button><button id="wmg" style="padding:5px 8px">一覧</button></span></div>
<div id="wd"></div><div id="wm"></div>
</div>
</aside>
</main>
<div id="pg-x" style="display:none"></div>
<div id="hd"><div class="in">
<div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:16px">履歴(現在のシーン)</h3><button id="hx">閉じる</button></div>
<div class="row" style="margin:8px 0;align-items:flex-start;flex-wrap:nowrap"><div id="hlist" style="width:190px;max-height:50vh;overflow:auto;border:1px solid var(--bd);border-radius:6px;padding:4px 8px"></div><div style="flex:1;min-width:0"><textarea id="hp" rows="14" readonly style="width:100%" placeholder="左の一覧から選ぶとプレビューします"></textarea><button id="hr" style="margin-top:6px">この状態に戻す</button></div></div>
<small class="mut">約5分ごと・シーン切替時に自動保存。1シーン最大20件。</small>
</div></div>
<div id="fx"></div>
<div id="dlg"><div class="in">
<div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:16px">言葉の一覧(<span id="wcnt">0</span>語)</h3><button id="dx">閉じる</button></div>
<div class="row" style="margin:8px 0"><input type="text" id="wq" placeholder="検索(語・読み・意味)" style="flex:1"></div>
<div id="wl" style="max-height:60vh"></div>
<div class="mut" style="margin-top:6px">行をタップすると「今日の言葉」に表示します。</div>
</div></div>
<script type="application/json" id="wjson">
[]
</script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var K="nv1_";
function sg(k,d){try{var v=localStorage.getItem(K+k);return v===null?d:v}catch(e){return d}}
function ss(k,v){try{localStorage.setItem(K+k,v);return true}catch(e){return false}}
var ed=$("ed"),hl=$("hl");
var PAL=["rgba(255,200,0,.5)","rgba(80,200,120,.45)","rgba(80,160,255,.45)","rgba(255,100,150,.45)","rgba(180,120,255,.45)","rgba(255,140,60,.5)"];
// 状態
var active=parseFloat(sg("act","0"))||0,added=parseInt(sg("add","0"))||0,lastIn=0,IDLE=30,prevLen=0;
var tmin=parseInt(sg("tmin","25"))||25,remain=parseFloat(sg("rem",""))||tmin*60,tend=0,running=false,ttotal=tmin*60,ph=0,BRK=parseInt(sg("brk","5"))||5;if(remain>ttotal)remain=ttotal;
function mk(t,x){return{id:uid(),t:t,x:x||""}}
function allSc(o){var a=[];o.ch.forEach(function(c){c.sc.forEach(function(s){a.push(s)})});return a}
function find(o,id){return allSc(o).filter(function(s){return s.id===id})[0]}
function total(o){return allSc(o).reduce(function(n,s){return n+cc(s.x)},0)}
function norm(o){if(!Array.isArray(o.ch)||!o.ch.length){o.ch=[{id:uid(),t:"第一章",sc:[mk("Scene 1",o.text)]}];delete o.text}o.ch.forEach(function(c){if(!c.sc||!c.sc.length)c.sc=[mk("Scene 1")]});if(!find(o,o.cs))o.cs=o.ch[0].sc[0].id;return o}
var S={},IDX={ids:[],cur:""};
function uid(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function saveStory(id){return ss("s_"+id,JSON.stringify(S[id]))}
function saveIdx(){return ss("idx",JSON.stringify(IDX))}
function loadAll(){
try{var x=JSON.parse(sg("idx",""));if(x&&Array.isArray(x.ids))IDX=x}catch(e){}
IDX.ids=IDX.ids.filter(function(id){try{var o=JSON.parse(sg("s_"+id,""));if(o&&(typeof o.text==="string"||Array.isArray(o.ch))){var m=!o.ch;S[id]=norm(o);if(m)saveStory(id);return true}}catch(e){}return false});
if(!IDX.ids.length){var id=uid();S[id]=norm({title:sg("title",""),text:sg("text",""),goal:sg("goal",""),upd:Date.now()});IDX.ids=[id];IDX.cur=id;saveStory(id);saveIdx()}
if(!S[IDX.cur])IDX.cur=IDX.ids[0];
}
loadAll();
var CS=S[IDX.cur];ed.value=find(CS,CS.cs).x;$("title").value=CS.title||"";$("goal").value=CS.goal||"";
prevLen=[...ed.value].length;$("tmin").value=tmin;
var th=sg("theme","");if(th)document.documentElement.setAttribute("data-theme",th);
var fs=sg("fs","17");$("fs").value=fs;document.documentElement.style.setProperty("--fs",fs+"px");
$("hlOn").checked=sg("hlOn","1")==="1";
var EX=[];try{EX=JSON.parse(sg("ex","[]"))}catch(e){}if(!Array.isArray(EX))EX=[];
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
// 単語分割
var seg=null;try{seg=new Intl.Segmenter("ja",{granularity:"word"})}catch(e){}
function tokens(text){
var out=[],m;
if(seg){for(var s of seg.segment(text)){if(s.isWordLike)out.push({w:s.segment,s:s.index,e:s.index+s.segment.length})}}
else{var re=/[\u4E00-\u9FFF]+|[ァ-ヶー]+|[ぁ-ん]+|[A-Za-z]+/g;while((m=re.exec(text)))out.push({w:m[0],s:m.index,e:m.index+m[0].length})}
return out.filter(function(t){return t.w.length>=2&&!(/^[ぁ-ん]+$/.test(t.w)&&t.w.length<3)&&!/^[0-9０-９]+$/.test(t.w)});
}
function highlight(){
var text=ed.value,ranges=[],words={};
if($("hlOn").checked){
var by={};tokens(text).forEach(function(t){(by[t.w]=by[t.w]||[]).push(t)});
var ci=0;
Object.keys(by).forEach(function(w){if(EX.indexOf(w)>=0)return;var L=by[w],hit=[];
for(var i=1;i<L.length;i++){if(L[i].e-L[i-1].s<=200){hit.push(L[i-1],L[i])}}
if(hit.length){var c=PAL[ci%PAL.length];ci++;words[w]=c;hit.forEach(function(t){ranges.push({s:t.s,e:t.e,c:c})})}});
ranges.sort(function(a,b){return a.s-b.s});
}
var html="",p=0;
ranges.forEach(function(r){if(r.s<p)return;html+=esc(text.slice(p,r.s))+'<mark style="background:'+r.c+'">'+esc(text.slice(r.s,r.e))+"</mark>";p=r.e});
html+=esc(text.slice(p))+"\n";hl.innerHTML=html;hl.scrollTop=ed.scrollTop;
var lg=Object.keys(words).slice(0,12).map(function(w){return '<span class="lg" data-w="'+encodeURIComponent(w)+'" title="クリックで除外語に追加" style="background:'+words[w]+';padding:1px 6px;border-radius:3px;margin-right:4px;cursor:pointer">'+esc(w)+"</span>"}).join("");
$("legend").innerHTML=lg;
}
// 統計
function stats(){
var t=ed.value,n=cc(t),n2=[...t.replace(/\s/g,"")].length;
$("c1").textContent=n;$("c2").textContent=n2;$("c3").textContent=(n/400).toFixed(1);
