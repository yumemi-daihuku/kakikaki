<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小説執筆ノート</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--bd:#ddd6c8;--mut:#777;--ac:#8a5a2b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--fg:#e8e4dc;--card:#26241f;--bd:#3d3a32;--mut:#9a958a;--ac:#d9a066}}
:root[data-theme="dark"]{--bg:#1b1a18;--fg:#e8e4dc;--card:#26241f;--bd:#3d3a32;--mut:#9a958a;--ac:#d9a066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
#title{flex:1;min-width:140px;font:700 18px inherit;font-family:inherit;background:transparent;color:var(--fg);border:0;border-bottom:1px dashed var(--bd);padding:4px}
button,select,input[type=number]{font-family:inherit;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
main{display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:12px;padding:12px 14px;max-width:1300px;margin:0 auto;align-items:start}
@media(max-width:960px){main{grid-template-columns:1fr}#sl{max-height:150px}}
#sl{max-height:62vh;overflow:auto;margin-bottom:8px}
.si{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;cursor:pointer}
.si.on{border-color:var(--ac);background:var(--bg)}
.si b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wrap{position:relative;height:62vh;min-height:320px;background:var(--card);border:1px solid var(--bd);border-radius:8px}
#hl,#ed{position:absolute;inset:0;margin:0;padding:14px;font-size:var(--fs,17px);line-height:1.9;font-family:inherit;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;overflow:auto;border:0;letter-spacing:0}
#hl{color:transparent;pointer-events:none;overflow:hidden}
#hl mark{color:transparent;border-radius:3px}
#ed{background:transparent;color:var(--fg);resize:none;outline:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:13px;color:var(--mut);font-weight:600}
.big{font-size:28px;font-variant-numeric:tabular-nums;font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#wd{font-size:22px;font-weight:700;color:var(--ac)}
#wm{font-size:14px;line-height:1.6;margin:4px 0 8px}
small,.mut{color:var(--mut);font-size:12px}
#fx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.6);z-index:50;color:#fff;font-size:18px;text-align:center;overflow:hidden}
#fx.on{display:flex;animation:fl .7s ease 3}
#fx b{font-size:44px;animation:pop .8s ease infinite alternate}
#fx b,#fx div,#fx button{position:relative}
#fx i{position:absolute;top:-20px;width:10px;height:14px;animation:fall 3s linear forwards}
@keyframes fl{50%{background:rgba(255,200,80,.6)}}
@keyframes pop{to{transform:scale(1.2)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#dlg{position:fixed;inset:0;display:none;background:rgba(0,0,0,.5);z-index:40;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));overflow:auto}
#dlg.on{display:block}
#dlg .in{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
#dlg h4{margin:12px 0 6px}
.in input[type=text],.in textarea{font-family:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px}
#wl{max-height:220px;overflow:auto;font-size:13px;border:1px solid var(--bd);border-radius:6px;padding:4px 8px}
.wi{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--bd);padding:3px 0}
body.focus aside,body.focus #side,body.focus header .opt{display:none}
body.focus main{grid-template-columns:1fr}
</style>
</head>
<body>
<header>
<input id="title" placeholder="作品タイトル" maxlength="80">
<span class="opt row">
<label class="mut">文字 <select id="fs"><option value="15">小</option><option value="17" selected>中</option><option value="20">大</option><option value="24">特大</option></select></label>
<button id="theme">🌓</button>
</span>
<button id="focus">集中モード</button>
<button id="copy">全文コピー</button>
</header>
<main>
<nav id="side" class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">📚 物語</h3><button id="sadd">＋ 新規</button></div><div id="sl"></div><div class="row"><button id="sdup">複製</button><button id="sdel">削除</button></div><small>題名は上部の欄で編集できます</small></nav>
<section>
<div id="wrap"><div id="hl"></div><textarea id="ed" placeholder="ここに物語を書き始めましょう…" spellcheck="false"></textarea></div>
<div class="row" style="margin-top:8px"><label class="mut"><input type="checkbox" id="hlOn" checked> 重複語ハイライト(200字以内に2回以上)</label></div>
<div id="legend" class="mut" style="margin-top:4px;line-height:1.8"></div>
<div class="mut" id="saved" style="margin-top:4px">未保存</div>
</section>
<aside>
<div class="card"><h3>⏱ 執筆タイマー(カウントダウン)</h3>
<div class="big" id="tm">25:00</div>
<div class="row" style="margin:4px 0"><input type="number" id="tmin" min="1" max="180" style="width:64px"><small>分</small><button class="pz" data-m="10">10</button><button class="pz" data-m="25">25</button><button class="pz" data-m="45">45</button></div>
<div class="row" style="margin-top:6px"><button id="go">▶ 開始</button><button id="rs">リセット</button></div></div>
<div class="card"><h3>✍ 執筆速度(常時計測)</h3>
<div class="stat"><span>速度</span><b><span id="spm">0</span> 字/分</b></div>
<div class="stat"><span>時速換算</span><b><span id="sph">0</span> 字/時</b></div>
<div class="stat"><span>今回書いた量</span><b><span id="add">0</span> 字</b></div>
<div class="stat"><span>執筆時間</span><b id="act">00:00</b></div>
<small>入力が30秒以上空いた間は執筆時間に含めません。一度に100字超の増加(貼り付け)は書いた量に数えません。</small>
<div class="row" style="margin-top:6px"><button id="rsp">記録をリセット</button></div></div>
<div class="card"><h3>📊 文字数</h3>
<div class="stat"><span>総文字数</span><b id="c1">0</b></div>
<div class="stat"><span>空白・改行除く</span><b id="c2">0</b></div>
<div class="stat"><span>原稿用紙(400字)</span><b id="c3">0</b></div>
<div class="stat"><span>段落数</span><b id="c4">0</b></div>
<div class="row" style="margin-top:6px"><small>目標</small><input type="number" id="goal" min="0" step="100" style="width:90px"><small>字</small></div>
<div class="bar"><i id="pb"></i></div><small id="pt"></small></div>
<div class="card">
<div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">📖 今日の言葉</h3><span class="row" style="gap:4px"><button id="pv" style="padding:5px 8px">←</button><button id="nx" style="padding:5px 8px">→</button><button id="wmg" style="padding:5px 8px">一覧</button></span></div>
<div id="wd"></div><div id="wm"></div>
<small>30秒ごとに自動で切り替わります</small></div>
</aside>
</main>
<div id="fx"></div>
<div id="dlg"><div class="in">
<div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:16px">言葉の一覧(<span id="wcnt">0</span>語)</h3><button id="dx">閉じる</button></div>
<div class="row" style="margin:8px 0"><input type="text" id="wq" placeholder="検索(語・読み・意味)" style="flex:1"></div>
<div id="wl" style="max-height:60vh"></div>
<div class="mut" style="margin-top:6px">行をタップすると「今日の言葉」に表示します。</div>
</div></div>
<script type="application/json" id="wjson">
[]
</script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var K="nv1_";
function sg(k,d){try{var v=localStorage.getItem(K+k);return v===null?d:v}catch(e){return d}}
function ss(k,v){try{localStorage.setItem(K+k,v);return true}catch(e){return false}}
var ed=$("ed"),hl=$("hl");
var PAL=["rgba(255,200,0,.5)","rgba(80,200,120,.45)","rgba(80,160,255,.45)","rgba(255,100,150,.45)","rgba(180,120,255,.45)","rgba(255,140,60,.5)"];
// 状態
var active=parseFloat(sg("act","0"))||0,added=parseInt(sg("add","0"))||0,lastIn=0,IDLE=30,prevLen=0;
var tmin=parseInt(sg("tmin","25"))||25,remain=parseFloat(sg("rem",""))||tmin*60,tend=0,running=false;
var S={},IDX={ids:[],cur:""};
function uid(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function saveStory(id){return ss("s_"+id,JSON.stringify(S[id]))}
function saveIdx(){return ss("idx",JSON.stringify(IDX))}
function loadAll(){
try{var x=JSON.parse(sg("idx",""));if(x&&Array.isArray(x.ids))IDX=x}catch(e){}
IDX.ids=IDX.ids.filter(function(id){try{var o=JSON.parse(sg("s_"+id,""));if(o&&typeof o.text==="string"){S[id]=o;return true}}catch(e){}return false});
if(!IDX.ids.length){var id=uid();S[id]={title:sg("title",""),text:sg("text",""),goal:sg("goal",""),upd:Date.now()};IDX.ids=[id];IDX.cur=id;saveStory(id);saveIdx()}
if(!S[IDX.cur])IDX.cur=IDX.ids[0];
}
loadAll();
var CS=S[IDX.cur];ed.value=CS.text;$("title").value=CS.title||"";$("goal").value=CS.goal||"";
prevLen=[...ed.value].length;$("tmin").value=tmin;
var th=sg("theme","");if(th)document.documentElement.setAttribute("data-theme",th);
var fs=sg("fs","17");$("fs").value=fs;document.documentElement.style.setProperty("--fs",fs+"px");
$("hlOn").checked=sg("hlOn","1")==="1";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
// 単語分割
var seg=null;try{seg=new Intl.Segmenter("ja",{granularity:"word"})}catch(e){}
function tokens(text){
var out=[],m;
if(seg){for(var s of seg.segment(text)){if(s.isWordLike)out.push({w:s.segment,s:s.index,e:s.index+s.segment.length})}}
else{var re=/[\u4E00-\u9FFF]+|[ァ-ヶー]+|[ぁ-ん]+|[A-Za-z]+/g;while((m=re.exec(text)))out.push({w:m[0],s:m.index,e:m.index+m[0].length})}
return out.filter(function(t){return t.w.length>=2&&!(/^[ぁ-ん]+$/.test(t.w)&&t.w.length<3)&&!/^[0-9０-９]+$/.test(t.w)});
}
function highlight(){
var text=ed.value,ranges=[],words={};
if($("hlOn").checked){
var by={};tokens(text).forEach(function(t){(by[t.w]=by[t.w]||[]).push(t)});
var ci=0;
Object.keys(by).forEach(function(w){var L=by[w],hit=[];
for(var i=1;i<L.length;i++){if(L[i].e-L[i-1].s<=200){hit.push(L[i-1],L[i])}}
if(hit.length){var c=PAL[ci%PAL.length];ci++;words[w]=c;hit.forEach(function(t){ranges.push({s:t.s,e:t.e,c:c})})}});
ranges.sort(function(a,b){return a.s-b.s});
}
var html="",p=0;
ranges.forEach(function(r){if(r.s<p)return;html+=esc(text.slice(p,r.s))+'<mark style="background:'+r.c+'">'+esc(text.slice(r.s,r.e))+"</mark>";p=r.e});
html+=esc(text.slice(p))+"\n";hl.innerHTML=html;hl.scrollTop=ed.scrollTop;
var lg=Object.keys(words).slice(0,12).map(function(w){return '<span style="background:'+words[w]+';padding:1px 6px;border-radius:3px;margin-right:4px">'+esc(w)+"</span>"}).join("");
$("legend").innerHTML=lg;
}
// 統計
function stats(){
var t=ed.value,n=[...t].length,n2=[...t.replace(/\s/g,"")].length;
$("c1").textContent=n;$("c2").textContent=n2;$("c3").textContent=(n/400).toFixed(1);
$("c4").textContent=t.split(/\n+/).filter(function(x){return x.trim()}).length;
var g=parseInt($("goal").value)||0;
if(g>0){var pc=Math.min(100,n/g*100);$("pb").style.width=pc+"%";$("pt").textContent=Math.floor(n/g*100)+"%(残り "+Math.max(0,g-n)+" 字)"}else{$("pb").style.width="0";$("pt").textContent=""}
}
function actNow(){return active+(lastIn?Math.min((Date.now()-lastIn)/1000,IDLE):0)}
function fmt(s){s=Math.max(0,Math.ceil(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function left(){return running?Math.max(0,(tend-Date.now())/1000):remain}
function speed(){var a=actNow();$("add").textContent=added;$("act").textContent=fmt(a);var pm=a>=5?added/(a/60):0;$("spm").textContent=pm.toFixed(1);$("sph").textContent=Math.round(pm*60)}
function tick(){var l=left();$("tm").textContent=fmt(l);if(running&&l<=0){running=false;remain=tmin*60;$("go").textContent="▶ 開始";$("tm").textContent=fmt(remain);done();save()}}
// 保存
var st=null;
function save(){syncCur();ss("act",actNow());ss("rem",left());ss("tmin",tmin);ss("add",added);
var ok=saveStory(IDX.cur)&&saveIdx();renderSide();$("saved").textContent=ok?"保存済み "+new Date().toLocaleTimeString("ja-JP"):"⚠ 保存できません(ブラウザの設定を確認)"}
function later(){$("saved").textContent="保存中…";clearTimeout(st);st=setTimeout(save,400)}
function syncCur(){var o=S[IDX.cur];if(!o)return;if(o.text!==ed.value||o.title!==$("title").value||o.goal!==$("goal").value){o.text=ed.value;o.title=$("title").value;o.goal=$("goal").value;o.upd=Date.now()}o.len=[...ed.value].length}
function renderSide(){var h="";IDX.ids.forEach(function(id){var o=S[id],on=id===IDX.cur,n=on?[...ed.value].length:(o.len!=null?o.len:[...o.text].length);h+='<div class="si'+(on?" on":"")+'" data-id="'+id+'"><b>'+esc((on?$("title").value:o.title)||"無題")+'</b><small>'+n+'字 ・ '+new Date(o.upd||0).toLocaleDateString("ja-JP")+'</small></div>'});$("sl").innerHTML=h}
function openStory(id){
clearTimeout(st);if(S[IDX.cur]){syncCur();saveStory(IDX.cur)}
IDX.cur=id;saveIdx();var o=S[id];ed.value=o.text;$("title").value=o.title||"";$("goal").value=o.goal||"";
prevLen=[...ed.value].length;ed.scrollTop=0;stats();highlight();renderSide();$("saved").textContent="切り替えました"}
$("sl").addEventListener("click",function(e){var el=e.target.closest(".si");if(el&&el.getAttribute("data-id")!==IDX.cur)openStory(el.getAttribute("data-id"))});
$("sadd").onclick=function(){var id=uid();S[id]={title:"",text:"",goal:"",upd:Date.now(),len:0};IDX.ids.unshift(id);saveStory(id);openStory(id);$("title").focus()};
$("sdup").onclick=function(){syncCur();var o=S[IDX.cur],id=uid();S[id]={title:(o.title||"無題")+"(複製)",text:o.text,goal:o.goal,upd:Date.now()};IDX.ids.splice(IDX.ids.indexOf(IDX.cur)+1,0,id);saveStory(id);openStory(id)};
$("sdel").onclick=function(){var o=S[IDX.cur];if(!confirm("「"+(o.title||"無題")+"」を削除しますか?元に戻せません。"))return;
var i=IDX.ids.indexOf(IDX.cur);try{localStorage.removeItem(K+"s_"+IDX.cur)}catch(e){}
delete S[IDX.cur];IDX.ids.splice(i,1);
if(!IDX.ids.length){var id=uid();S[id]={title:"",text:"",goal:"",upd:Date.now()};IDX.ids=[id];saveStory(id)}
openStory(IDX.ids[Math.min(i,IDX.ids.length-1)])};
var ht=null;
ed.addEventListener("input",function(){
var n=[...ed.value].length,d=n-prevLen,now=Date.now();if(d>0&&d<=100)added+=d;if(lastIn)active+=Math.min((now-lastIn)/1000,IDLE);lastIn=now;prevLen=n;
stats();speed();later();clearTimeout(ht);ht=setTimeout(highlight,120)});
ed.addEventListener("scroll",function(){hl.scrollTop=ed.scrollTop});
$("title").addEventListener("input",later);
$("goal").addEventListener("input",function(){stats();later()});
$("hlOn").addEventListener("change",function(){ss("hlOn",this.checked?"1":"0");highlight()});
$("fs").addEventListener("change",function(){ss("fs",this.value);document.documentElement.style.setProperty("--fs",this.value+"px");highlight()});
var ac=null;
function initAudio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}
function beep(f,t,d){try{var o=ac.createOscillator(),g=ac.createGain(),T=ac.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(.3,T+.03);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d+.05)}catch(e){}}
function done(){initAudio();[784,988,1175,1568,1175,1568,1976].forEach(function(f,i){beep(f,i*.2,.28)});
try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
var cs=["#f66","#fc3","#6c6","#6af","#c8f"],h="";for(var k=0;k<40;k++)h+='<i style="left:'+Math.random()*100+'%;background:'+cs[k%5]+';animation-delay:'+(Math.random()*1.5).toFixed(2)+'s"></i>';
$("fx").innerHTML=h+'<b>🎉 時間です!</b><div style="margin:8px">お疲れさまでした。現在 '+[...ed.value].length+' 字</div><button id="fxc">閉じる</button>';
$("fx").className="on";$("fxc").onclick=function(){$("fx").className=""}}
$("go").onclick=function(){initAudio();if(running){remain=left();running=false;this.textContent="▶ 再開"}else{if(remain<=0)remain=tmin*60;tend=Date.now()+remain*1000;running=true;this.textContent="⏸ 一時停止"}tick();save()};
$("rs").onclick=function(){running=false;remain=tmin*60;$("go").textContent="▶ 開始";tick();save()};
function setMin(m){m=Math.min(180,Math.max(1,parseInt(m)||25));tmin=m;$("tmin").value=m;if(!running){remain=m*60;tick();save()}}
$("tmin").addEventListener("change",function(){setMin(this.value)});
Array.prototype.forEach.call(document.querySelectorAll(".pz"),function(b){b.onclick=function(){setMin(b.getAttribute("data-m"))}});
$("rsp").onclick=function(){if(!confirm("執筆速度の記録をリセットしますか?(本文は消えません)"))return;active=0;added=0;lastIn=0;speed();save()};
$("theme").onclick=function(){var d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()==="#1b1a18";var v=dark?"light":"dark";d.setAttribute("data-theme",v);ss("theme",v)};
$("focus").onclick=function(){document.body.classList.toggle("focus");this.textContent=document.body.classList.contains("focus")?"通常表示":"集中モード"};
$("copy").onclick=function(){var b=this;function ok(){b.textContent="コピーしました";setTimeout(function(){b.textContent="全文コピー"},1500)}
try{navigator.clipboard.writeText(ed.value).then(ok,fb)}catch(e){fb()}
function fb(){ed.select();try{document.execCommand("copy");ok()}catch(e){}}};
document.addEventListener("visibilitychange",function(){if(document.hidden)save()});
window.addEventListener("pagehide",save);
setInterval(function(){speed();tick()},250);setInterval(function(){if(running)save()},10000);
// 言葉(HTML内のJSON、または同じ場所のwords.jsonから読み込み)
function clean(a){var seen={},o=[];a.forEach(function(x){if(x&&typeof x.word==="string"&&x.word.trim()&&typeof x.meaning==="string"&&!seen[x.word.trim()]){var w=x.word.trim();seen[w]=1;o.push({word:w,reading:String(x.reading||"").trim(),meaning:x.meaning.trim()})}});return o}
function parse(t){try{var v=JSON.parse(t);if(!Array.isArray(v)&&v&&Array.isArray(v.words))v=v.words;return Array.isArray(v)?clean(v):null}catch(e){return null}}
var W=[],wi=0,wt=null;
function showW(){var w=W[wi];if(!w){$("wd").textContent="言葉がありません";$("wm").textContent="words.json を読み込めないか、中身が空です。ファイルを直接開かず、GitHub Pagesなどweb経由で開いているか確認してください。";return}$("wd").textContent=w.word+(w.reading?"("+w.reading+")":"");$("wm").textContent=w.meaning}
function nextW(d){if(W.length)wi=(wi+d+W.length)%W.length;showW();clearInterval(wt);wt=setInterval(function(){nextW(1)},30000)}
$("nx").onclick=function(){nextW(1)};$("pv").onclick=function(){nextW(-1)};
function renderList(){var q=$("wq").value.trim(),h="";$("wcnt").textContent=W.length;W.forEach(function(x,i){if(q&&(x.word+x.reading+x.meaning).indexOf(q)<0)return;h+='<div class="wi" data-i="'+i+'" style="cursor:pointer"><span style="flex:1"><b>'+esc(x.word)+'</b> '+esc(x.reading)+' <span class="mut">'+esc(x.meaning)+'</span></span></div>'});$("wl").innerHTML=h||'<div class="mut">該当なし</div>'}
function setWords(a){W=a;wi=Math.floor(Math.random()*Math.max(1,W.length));nextW(0);renderList()}
$("wmg").onclick=function(){renderList();$("dlg").classList.add("on")};
$("dx").onclick=function(){$("dlg").classList.remove("on")};
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("dlg").classList.remove("on")});
$("wq").addEventListener("input",renderList);
$("wl").addEventListener("click",function(e){var el=e.target.closest(".wi");if(!el)return;wi=parseInt(el.getAttribute("data-i"));nextW(0);$("dlg").classList.remove("on")});
setWords(parse($("wjson").textContent)||[]);
try{fetch("words.json",{cache:"no-store"}).then(function(r){return r.ok?r.text():Promise.reject()}).then(function(t){var a=parse(t);if(a&&a.length)setWords(a)}).catch(function(){})}catch(e){}
renderSide();stats();speed();tick();highlight();
if(ed.value!=="")$("saved").textContent="前回の内容を復元しました";
})();
</script>
